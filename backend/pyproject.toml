[project]
name = "trisay-lite-backend"
version = "0.1.0"
description = "FastAPI backend for local Whisper transcription."
requires-python = ">=3.12"
dependencies = [
  "aiofiles>=24.1.0",
  "fastapi>=0.115.0",
  "mlx>=0.20.0",
  "mlx-whisper>=0.4.0",
  "numpy>=2.0.0",
  "opencc-python-reimplemented>=0.1.7",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "soundfile>=0.12.1",
  "uvicorn[standard]>=0.32.0",
  "websockets>=13.1"
]

[tool.uv]
package = false
